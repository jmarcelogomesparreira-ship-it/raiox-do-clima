<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raio-X do Clima — o clima de todo o Brasil</title>
<meta name="description" content="Clima de qualquer município do Brasil: agora, previsão, histórico desde 1940, alertas e dicas para quem planta.">
<meta name="theme-color" content="#0b6fa4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌦️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --azul:#0b6fa4; --azul-escuro:#08486b; --azul-claro:#e3f2fb;
    --verde:#2f9e5b; --sol:#f4b400; --perigo:#d94141;
    --texto:#14212b; --texto-2:#4f6170; --linha:#dde5ec;
    --fundo:#f3f6f9; --cartao:#ffffff;
    --sombra:0 6px 24px rgba(13,40,60,.14);
    --raio:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);background:var(--fundo)}
  button{font:inherit;cursor:pointer}
  #mapa{position:fixed;inset:0;background:#cfe3ef}

  /* ===== Barra do topo ===== */
  .topo{position:fixed;top:12px;left:12px;right:12px;z-index:1000;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  .marca{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--cartao);border-radius:var(--raio);padding:10px 14px;box-shadow:var(--sombra);white-space:nowrap}
  .marca .logo{font-size:26px;line-height:1}
  .marca b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px}
  .marca small{display:block;font-size:11.5px;color:var(--texto-2)}
  .busca{pointer-events:auto;position:relative;flex:1;max-width:460px}
  .busca input{width:100%;height:52px;border:0;border-radius:var(--raio);padding:0 16px 0 46px;font:inherit;font-size:16px;box-shadow:var(--sombra);outline:none;background:var(--cartao)}
  .busca input:focus{box-shadow:var(--sombra),0 0 0 3px rgba(11,111,164,.35)}
  .busca .lupa{position:absolute;left:15px;top:14px;font-size:20px;opacity:.6}
  .sugestoes{position:absolute;top:58px;left:0;right:0;background:var(--cartao);border-radius:12px;box-shadow:var(--sombra);overflow:hidden;display:none}
  .sugestoes.aberta{display:block}
  .sugestoes button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--linha)}
  .sugestoes button:last-child{border-bottom:0}
  .sugestoes button.ativa,.sugestoes button:hover{background:var(--azul-claro)}
  .sugestoes span{color:var(--texto-2);font-size:13px;font-weight:600}
  .sugestoes .vazio{padding:12px 16px;color:var(--texto-2);font-size:14px}

  /* ===== Trilha (Brasil › MG › Cidade) ===== */
  .trilha{position:fixed;left:12px;top:80px;z-index:999;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .trilha button{border:0;background:var(--cartao);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(13,40,60,.12);color:var(--azul-escuro)}
  .trilha button[disabled]{color:var(--texto);cursor:default}
  .trilha i{font-style:normal;color:var(--texto-2);font-size:13px}

  /* ===== Botões flutuantes ===== */
  .acoes{position:fixed;right:12px;bottom:24px;z-index:999;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .btn-flut{border:0;background:var(--cartao);border-radius:14px;height:50px;min-width:50px;padding:0 16px;box-shadow:var(--sombra);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--texto)}
  .btn-flut.principal{background:var(--azul);color:#fff;height:56px;font-size:16px}
  .btn-flut.principal:hover{background:var(--azul-escuro)}
  .camadas{display:flex;background:var(--cartao);border-radius:14px;box-shadow:var(--sombra);overflow:hidden}
  .camadas button{border:0;background:none;padding:10px 12px;font-size:13px;font-weight:600;color:var(--texto-2)}
  .camadas button.ativa{background:var(--azul-claro);color:var(--azul-escuro)}

  /* ===== Painel do município ===== */
  .painel{position:fixed;z-index:1001;background:var(--cartao);box-shadow:var(--sombra);display:flex;flex-direction:column;transition:transform .3s ease}
  .painel.fechado{pointer-events:none}
  .painel-cab{padding:18px 18px 12px;border-bottom:1px solid var(--linha);position:relative}
  .alca{display:none}
  .painel h2{margin:0;font-size:22px;letter-spacing:-.4px;padding-right:40px}
  .painel .sub{color:var(--texto-2);font-size:13.5px;margin-top:3px}
  .fechar{position:absolute;right:12px;top:14px;border:0;background:var(--fundo);width:36px;height:36px;border-radius:50%;font-size:18px}
  .botoes-cab{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{border:1px solid var(--linha);background:var(--cartao);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
  .chip:hover{background:var(--fundo)}
  .painel-corpo{overflow-y:auto;padding:16px 18px 24px;flex:1}

  .agora{background:linear-gradient(135deg,#0b6fa4,#1c9ad6);color:#fff;border-radius:var(--raio);padding:18px;position:relative;overflow:hidden}
  .agora.noite{background:linear-gradient(135deg,#1d2b4f,#3a4f86)}
  .agora .rot{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.85;font-weight:600}
  .agora .linha1{display:flex;align-items:center;gap:14px;margin-top:6px}
  .agora .temp{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
  .agora .icone{font-size:52px;line-height:1}
  .agora .desc{font-size:17px;font-weight:600;margin-top:8px}
  .agora .maxmin{font-size:14px;opacity:.9;margin-top:2px}
  .grade{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  .item{background:var(--fundo);border-radius:12px;padding:12px}
  .item .r{font-size:12px;color:var(--texto-2);font-weight:600;display:flex;gap:6px;align-items:center}
  .item .v{font-size:20px;font-weight:700;margin-top:4px}
  .item .v small{font-size:13px;font-weight:600;color:var(--texto-2)}
  .bussola{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--azul);color:#fff;font-size:12px;font-weight:800;transition:transform .4s}
  .secao{margin-top:20px}
  .secao h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--texto-2);margin:0 0 10px}
  .info{font-size:14px;color:var(--texto-2);line-height:1.7}
  .info b{color:var(--texto)}
  .proximas{list-style:none;padding:0;margin:0;display:grid;gap:8px}
  .proximas li{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px;border:1px dashed var(--linha);border-radius:12px;color:var(--texto-2)}
  .carregando{display:flex;gap:10px;align-items:center;color:var(--texto-2);padding:20px 0}
  .giro{width:22px;height:22px;border:3px solid var(--linha);border-top-color:var(--azul);border-radius:50%;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .erro{background:#fdecec;color:#8a1f1f;border-radius:12px;padding:12px;font-size:14px}


  /* ===== Etapa 2: abas, dias, horas e gráficos ===== */
  .painel-cab{padding-bottom:0}
  .abas{display:grid;grid-template-columns:repeat(5,1fr);margin:14px -18px 0;padding:0 8px}
  .abas button{border:0;background:none;padding:8px 2px 10px;font-size:13px;font-weight:600;color:var(--texto-2);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
  .abas button .ic-aba{font-size:18px}
  .abas button.ativa{color:var(--azul-escuro);border-bottom-color:var(--azul)}
  .resumo{font-size:14.5px;line-height:1.55;margin:0 0 12px;color:var(--texto)}
  .mini-dias{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .mini-dia{border:1px solid var(--linha);background:var(--cartao);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
  .mini-dia:hover{background:var(--azul-claro)}
  .mini-dia .ic{font-size:22px}
  .mini-dia small{color:var(--texto-2)}
  .mini-dia .ch{font-size:11.5px}
  .link-aba{border:0;background:none;color:var(--azul);font-weight:700;font-size:14px;padding:10px 0 0}
  .secao.primeira{margin-top:4px}
  .h3-extra{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px;color:var(--texto-2);font-size:12px}
  .lista-dias{display:flex;flex-direction:column}
  .dia{display:grid;grid-template-columns:82px 32px 62px 1fr;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--linha);background:none;padding:10px 4px;text-align:left;font-size:14px}
  .dia:hover{background:var(--fundo)}
  .dia.tend{opacity:.72}
  .d-nome{font-weight:600}
  .d-ic{font-size:22px;text-align:center}
  .d-chuva{display:flex;flex-direction:column;font-weight:600;color:var(--texto-2);font-size:13px;line-height:1.2}
  .d-chuva.tem{color:var(--azul-escuro)}
  .d-chuva small{font-weight:500;font-size:11.5px}
  .d-temp{display:flex;align-items:center;gap:8px}
  .d-temp small{color:var(--texto-2);font-size:13px;min-width:28px;text-align:right}
  .d-temp b{min-width:30px}
  .faixa{flex:1;height:6px;border-radius:6px;background:var(--fundo);position:relative;display:block}
  .faixa i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#2a78c8,#e0662d)}
  .sep-tend{font-size:12.5px;color:var(--texto-2);background:var(--fundo);border-radius:10px;padding:8px 10px;margin:10px 0 4px}
  .nota{font-size:12.5px;color:var(--texto-2);margin-top:16px;line-height:1.5}
  .chips-dias{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
  .chip-dia{border:1px solid var(--linha);background:var(--cartao);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .chip-dia.ativa{background:var(--azul);color:#fff;border-color:var(--azul)}
  .faixa-horas{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
  .hora{flex:0 0 84px;scroll-snap-align:start;background:var(--fundo);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--texto-2)}
  .hora b{color:var(--texto);font-size:13px}
  .hora .ic{font-size:24px}
  .hora .t{font-size:18px;font-weight:700;color:var(--texto)}
  .hora.passou{opacity:.45}
  .hora.agora-h{background:var(--azul-claro);outline:2px solid var(--azul)}
  .graf{position:relative}
  .graf svg{display:block;overflow:visible}
  .g-grade{stroke:#e8edf2;stroke-width:1}
  .g-base{stroke:#b9c5cf;stroke-width:1}
  .g-eixo{font-size:10.5px;fill:#6b7c8a;font-family:Inter,sans-serif}
  .g-rot{font-size:11.5px;font-weight:700;fill:var(--texto);font-family:Inter,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px}
  .g-mira{stroke:#8a9aa8;stroke-width:1;stroke-dasharray:3 3}
  .g-tend{fill:#f3f6f9}
  .g-barra{transition:opacity .15s}
  .g-barra.acesa{opacity:.7}
  .g-legenda{display:flex;gap:14px;font-size:12.5px;color:var(--texto-2);margin-bottom:4px}
  .g-legenda span{display:flex;align-items:center;gap:6px}
  .g-legenda i{width:14px;height:2.5px;border-radius:2px;display:inline-block}
  .g-dica{position:absolute;top:6px;display:none;background:var(--cartao);border:1px solid var(--linha);box-shadow:0 4px 14px rgba(13,40,60,.15);border-radius:10px;padding:8px 10px;font-size:12.5px;pointer-events:none;white-space:nowrap;z-index:2}
  .g-dica div{display:flex;align-items:center;gap:6px;color:var(--texto-2)}
  .g-dica b{color:var(--texto);font-size:13.5px}
  .g-dica .g-dica-tit{font-weight:600;color:var(--texto);margin-bottom:3px}
  .g-dica i{width:12px;height:2.5px;border-radius:2px;display:inline-block}

  /* ===== Etapa 3: histórico ===== */
  .kpi .k-sub{font-size:12px;color:var(--texto-2);margin-top:4px;line-height:1.4}
  .kpi{border-left:4px solid transparent}
  .kpi.seco{border-left-color:#e08a1e}
  .kpi.umido{border-left-color:#2a78c8}
  .kpi.ok{border-left-color:#2f9e5b}
  .sel-ano{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:600;margin-bottom:8px}
  .sel-ano select{font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:1px solid var(--linha);background:var(--cartao)}
  .g-legenda i.caixa{width:10px;height:10px;border-radius:3px}
  .listras{position:relative;display:flex;height:64px;border-radius:10px;overflow:visible;cursor:crosshair}
  .listras > i{flex:1;display:block;height:100%}
  .listras > i:first-child{border-radius:10px 0 0 10px}
  .listras > i:nth-last-child(2){border-radius:0 10px 10px 0}
  .listras .g-dica{top:70px}
  .listras-leg{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--texto-2);margin:6px 0 10px;gap:8px}
  .listras-leg .esc{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
  .listras-leg .esc i{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--linha)}
  .recordes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .recordes div{background:var(--fundo);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .recordes span{font-size:12px;color:var(--texto-2);font-weight:600}
  .recordes b{font-size:18px}
  .recordes small{font-size:12px;color:var(--texto-2)}
  .tabela-wrap{overflow-x:auto}
  .tabela{width:100%;border-collapse:collapse;font-size:13.5px}
  .tabela th{text-align:right;font-size:11.5px;color:var(--texto-2);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--linha)}
  .tabela td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
  .tabela th:first-child,.tabela td:first-child{text-align:left;font-weight:600}
  .tabela tr.tot td{font-weight:700;border-bottom:0}

  /* ===== Etapa 4: camadas e avisos ===== */
  .cartao-camadas{position:fixed;left:12px;top:126px;z-index:998;width:280px;background:var(--cartao);border-radius:var(--raio);box-shadow:var(--sombra);overflow:hidden;max-height:calc(100vh - 220px);overflow-y:auto}
  .cartao-camadas:empty{display:none}
  .cc-cab{width:100%;border:0;background:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:14.5px;text-align:left}
  .cc-cab span{margin-left:auto;color:var(--texto-2)}
  .cc-corpo{padding:0 14px 12px}
  .cc-corpo.oculto{display:none}
  .cc-opcoes{display:flex;flex-wrap:wrap;gap:6px}
  .cc-opcoes button{border:1px solid var(--linha);background:var(--cartao);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--texto)}
  .cc-opcoes button.ativa{background:var(--azul);border-color:var(--azul);color:#fff}
  .cc-opcoes button[disabled]{opacity:.4;cursor:not-allowed}
  .cc-avisos{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;font-weight:600;cursor:pointer}
  .cc-avisos input{width:18px;height:18px;accent-color:var(--azul)}
  .cc-dias{display:flex;gap:6px;margin-top:8px}
  .cc-dias button{flex:1;border:1px solid var(--linha);background:var(--cartao);border-radius:10px;padding:6px;font-size:12.5px;font-weight:600}
  .cc-dias button.ativa{background:var(--azul-claro);border-color:var(--azul);color:var(--azul-escuro)}
  .cc-lista{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .cc-lista button{border:0;background:var(--fundo);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13px}
  .cc-lista button i{width:12px;height:12px;border-radius:3px;flex:0 0 12px;margin-top:3px;border:1px solid rgba(0,0,0,.2)}
  .cc-lista small{display:block;color:var(--texto-2);font-size:11.5px;margin-top:2px}
  .cc-vazio{font-size:13px;color:var(--texto-2);margin:6px 0 0}
  .leg{border-top:1px solid var(--linha);padding:10px 14px 12px}
  .leg-tit{font-size:12.5px;font-weight:700;margin-bottom:6px}
  .leg-grad{height:12px;border-radius:6px;border:1px solid var(--linha)}
  .leg-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--texto-2);margin-top:3px}
  .leg-cat{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px}
  .leg-cat span{display:flex;align-items:center;gap:5px}
  .leg-cat i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .leg-ponto{font-size:13px;margin-top:8px;color:var(--texto-2)}
  .leg-ponto b{color:var(--texto)}
  .leg-atual{font-size:11px;color:var(--texto-2);margin-top:4px}
  .aviso-mun{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:color-mix(in srgb,var(--cor-aviso) 22%,#fff);border:2px solid var(--cor-aviso)}
  .aviso-mun summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}
  .aviso-mun summary::-webkit-details-marker{display:none}
  .aviso-mun summary::after{content:"▾";margin-left:auto;color:var(--texto-2)}
  .aviso-mun[open] summary::after{content:"▴"}
  .aviso-mun .av-ic{font-size:26px}
  .aviso-mun b{display:block;font-size:15px}
  .aviso-mun small{display:block;font-size:12.5px;color:var(--texto-2);margin-top:2px}
  .aviso-mun p,.aviso-mun ul{font-size:13.5px;line-height:1.5;margin:10px 0 0}
  .aviso-mun ul{padding-left:18px}
  .aviso-mun .av-fonte{font-size:11.5px;color:var(--texto-2)}
  @media (max-width:820px){
    .cartao-camadas{top:184px;width:auto;max-width:calc(100% - 24px)}
    body.com-painel .cartao-camadas{display:none}
  }

  /* ===== Etapa 5: pulverização ===== */
  .abas button{font-size:12px}
  .veredito{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px;margin-bottom:14px;border:2px solid}
  .veredito.bom{background:#e9f6ee;border-color:#2f9e5b}
  .veredito.atencao{background:#fdf7dc;border-color:#e6c229}
  .veredito.ruim{background:#fdecec;border-color:#dc3c3d}
  .veredito .v-ic{font-size:30px;line-height:1}
  .veredito b{font-size:16.5px}
  .veredito p{margin:4px 0 0;font-size:14px;line-height:1.5}
  .semaforo{display:flex;flex-direction:column;gap:3px}
  .sem-linha{display:flex;align-items:center;gap:6px}
  .sem-dia{flex:0 0 58px;font-size:12px;font-weight:600;color:var(--texto-2)}
  .sem-cels{flex:1;display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
  .sem-horas span{font-size:10px;color:var(--texto-2)}
  .cel{border:0;padding:0;height:20px;border-radius:3px;cursor:pointer}
  .cel.bom{background:#2f9e5b}.cel.atencao{background:#e6c229}.cel.ruim{background:#dc3c3d}.cel.passou{background:#e3e8ed;cursor:default}
  .cel:hover{outline:2px solid var(--texto);outline-offset:1px}
  .cel.sel{outline:2.5px solid var(--texto);outline-offset:1px}
  .sem-leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--texto-2);margin-top:8px}
  .sem-leg span{display:flex;align-items:center;gap:5px}
  .sem-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .det-hora{background:var(--fundo);border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px;color:var(--texto-2);line-height:1.5}
  .det-hora b{color:var(--texto)}
  .det-hora ul{margin:6px 0 0;padding-left:18px;color:var(--texto)}
  .det-hora p{margin:6px 0 0;color:var(--texto)}
  .det-vals{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;color:var(--texto)}
  .criterios{margin-top:12px;font-size:13.5px;line-height:1.5}
  .criterios summary{cursor:pointer;font-weight:600;color:var(--azul-escuro)}
  .criterios ul{padding-left:18px;margin:8px 0 0}

  /* ===== Etapa 6: plantio ===== */
  .sub-abas{display:flex;gap:6px;margin-bottom:12px}
  .sub-abas button{flex:1;border:1px solid var(--linha);background:var(--cartao);border-radius:12px;padding:9px 6px;font-size:13.5px;font-weight:600}
  .sub-abas button.ativa{background:var(--azul);border-color:var(--azul);color:#fff}
  .pl-filtros{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .pl-filtros label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--texto-2)}
  .pl-filtros select{font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--linha);background:var(--cartao);color:var(--texto)}
  .pl-man{margin:0;font-size:13px;color:var(--texto-2)}
  .seg{display:flex;border:1px solid var(--linha);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:0;background:var(--cartao);padding:8px 4px;font-size:13px;font-weight:600;border-right:1px solid var(--linha)}
  .seg button:last-child{border-right:0}
  .seg button.ativa{background:var(--azul-claro);color:var(--azul-escuro)}
  .seg button[disabled]{opacity:.35;cursor:not-allowed}
  .cal-zarc{margin:4px 0 6px}
  .cal-meses{display:grid;grid-template-columns:repeat(12,1fr);font-size:10.5px;color:var(--texto-2);text-align:center;margin-bottom:3px}
  .cal-decs{display:grid;grid-template-columns:repeat(36,1fr);gap:1.5px}
  .dec{display:block;height:26px;border-radius:2px;position:relative}
  .dec.r2{background:#2f9e5b}.dec.r3{background:#e6c229}.dec.r4{background:#f18a3c}.dec.r0{background:#e3e8ed}
  .dec:nth-child(3n+1){margin-left:1.5px}
  .dec.hoje,.cal-horta i.hoje{outline:2.5px solid var(--texto);outline-offset:1px;z-index:1}
  .leg-hoje{background:#fff!important;outline:2px solid var(--texto)}
  .cal-horta{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
  .cal-horta i{display:block;height:22px;border-radius:4px;background:#e3e8ed}
  .cal-horta i.on{background:#2f9e5b}
  .horta-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .horta-card{border:1px solid var(--linha);background:var(--cartao);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom-width:4px}
  .horta-card.bom{border-bottom-color:#2f9e5b}.horta-card.atencao{border-bottom-color:#e6c229}.horta-card.ruim{border-bottom-color:#dc3c3d}
  .horta-card.sel{background:var(--azul-claro);border-color:var(--azul)}
  .horta-card .hc-ic{font-size:26px}
  .horta-card b{font-size:13.5px}
  .horta-card small{font-size:11px;color:var(--texto-2)}
  .horta-det{margin-top:12px}
  .rodape{position:fixed;left:12px;bottom:8px;z-index:998;font-size:11px;color:var(--texto-2);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:8px;max-width:calc(100% - 200px)}
  .rodape a{color:var(--azul-escuro)}
  .leaflet-control-attribution{font-size:10px}
  .leaflet-tooltip.nome-mun{font-family:Inter,sans-serif;font-weight:600;font-size:13px;border-radius:8px;padding:4px 8px}
  .aviso{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1002;background:var(--cartao);padding:18px 22px;border-radius:var(--raio);box-shadow:var(--sombra);font-size:15px;max-width:340px;text-align:center;display:none}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:1003;background:#14212b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:1}

  /* Computador: painel na direita */
  @media (min-width:821px){
    .painel{top:12px;right:12px;bottom:12px;width:440px;border-radius:20px}
    .painel.fechado{transform:translateX(calc(100% + 30px))}
    body.com-painel .acoes{right:464px}
  }
  /* Celular: painel sobe de baixo */
  @media (max-width:820px){
    .marca small{display:none}
    .marca{padding:10px 12px}
    .marca b{font-size:14px}
    .topo{flex-wrap:wrap}
    .busca{flex-basis:100%;max-width:none;order:2}
    .trilha{top:136px}
    .painel{left:0;right:0;bottom:0;max-height:72vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
    .painel.fechado{transform:translateY(105%)}
    .alca{display:block;width:44px;height:5px;border-radius:5px;background:var(--linha);margin:-6px auto 10px}
    .acoes{bottom:20px}
    body.com-painel .acoes{display:none}
    .rodape{max-width:calc(100% - 24px);bottom:auto;top:auto;bottom:6px;font-size:10px}
    .camadas button{padding:9px 10px;font-size:12px}
  }
</style>
</head>
<body>

<div id="mapa" role="application" aria-label="Mapa do Brasil"></div>

<header class="topo">
  <div class="marca">
    <span class="logo">🌦️</span>
    <div><b>Raio-X do Clima</b><small>O clima de todo o Brasil</small></div>
  </div>
  <div class="busca">
    <span class="lupa">🔎</span>
    <input id="busca" type="search" placeholder="Digite sua cidade… ex.: Iturama" autocomplete="off" aria-label="Buscar município">
    <div class="sugestoes" id="sugestoes" role="listbox"></div>
  </div>
</header>

<nav class="trilha" id="trilha"></nav>
<div class="cartao-camadas" id="cartaoCamadas"></div>

<div class="acoes">
  <div class="camadas" id="camadas" aria-label="Tipo de mapa">
    <button data-base="mapa" class="ativa">🗺️ Mapa</button>
    <button data-base="satelite">🛰️ Satélite</button>
    <button data-base="relevo">⛰️ Relevo</button>
  </div>
  <button class="btn-flut" id="btnBrasil" title="Ver o Brasil inteiro">🇧🇷 Brasil</button>
  <button class="btn-flut principal" id="btnLocal">📍 Usar minha localização</button>
</div>

<aside class="painel fechado" id="painel" aria-live="polite">
  <div class="painel-cab">
    <div class="alca"></div>
    <h2 id="pNome">—</h2>
    <div class="sub" id="pSub"></div>
    <button class="fechar" id="pFechar" aria-label="Fechar">✕</button>
    <div class="botoes-cab">
      <button class="chip" id="btnOuvir">🔊 Ouvir</button>
      <button class="chip" id="btnLink">🔗 Compartilhar</button>
    </div>
    <nav class="abas" id="abas" aria-label="Seções">
      <button data-aba="agora" class="ativa"><span class="ic-aba">☀️</span>Agora</button>
      <button data-aba="dias"><span class="ic-aba">📅</span>16 dias</button>
      <button data-aba="hora"><span class="ic-aba">🕐</span>Hora a hora</button>
      <button data-aba="hist"><span class="ic-aba">📈</span>Histórico</button>
      <button data-aba="campo"><span class="ic-aba">🌱</span>Campo</button>
    </nav>
  </div>
  <div class="painel-corpo" id="pCorpo"></div>
</aside>

<div class="rodape">
  Dados: <a href="https://www.ibge.gov.br" target="_blank" rel="noopener">IBGE</a> ·
  <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) ·
  Feito por <a href="https://github.com/jmarcelogomesparreira-ship-it" target="_blank" rel="noopener">Marcelo Parreira</a>
</div>
<div class="aviso" id="aviso"></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* =========================================================
   Raio-X do Clima — Etapa 1
   Mapa do Brasil · zoom por estado e município · busca ·
   "minha localização" · clima de agora (prévia da Etapa 2)
   ========================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

const estado = {
  municipios: [],          // [id, nome, uf, lat, lon]
  porId: new Map(),
  estados: {},             // sigla -> {nome, regiao, id}
  ufAberta: null,
  camadaMun: null,
  cacheMun: {},            // sigla -> geojson
  selecionado: null,       // linha do município
  climaAtual: null
};

/* ---------- Mapa base ---------- */
const mapa = L.map("mapa", {
  zoomControl: false, preferCanvas: true, minZoom: 3, maxZoom: 15,
  maxBounds: [[-40, -90], [10, -25]], maxBoundsViscosity: .8
}).setView([-14.5, -52], 4);
L.control.zoom({ position: "bottomleft" }).addTo(mapa);
mapa.createPane("clima").style.zIndex = 350;
const paneAvisos = mapa.createPane("avisos"); paneAvisos.style.zIndex = 390; paneAvisos.style.pointerEvents = "none";

const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const bases = {
  mapa: L.layerGroup([
    L.tileLayer(ESRI + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Mapa © Esri, HERE, Garmin, © OpenStreetMap", maxZoom: 16 }),
    L.tileLayer(ESRI + "Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, pane: "shadowPane" })
  ]),
  satelite: L.layerGroup([
    L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Imagens © Esri, Maxar, Earthstar Geographics", maxZoom: 19 }),
    L.tileLayer(ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, pane: "shadowPane" })
  ]),
  relevo: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    { attribution: "© OpenTopoMap (CC-BY-SA) · © OpenStreetMap", subdomains: "abc", maxZoom: 17 })
};
let baseAtual = bases.mapa.addTo(mapa);
$("camadas").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mapa.removeLayer(baseAtual);
  baseAtual = bases[b.dataset.base].addTo(mapa);
  baseAtual.bringToBack?.();
  document.querySelectorAll("#camadas button").forEach(x => x.classList.toggle("ativa", x === b));
  restilizar();
});

/* Cores suaves por região */
const corRegiao = { "Norte":"#2f9e5b", "Nordeste":"#e08a1e", "Centro-Oeste":"#c9a227", "Sudeste":"#0b6fa4", "Sul":"#6b5bd2" };
const naSatelite = () => baseAtual === bases.satelite;

/* ---------- Camada dos estados ---------- */
let camadaUF = null;
function estiloUF(f) {
  const aberta = estado.ufAberta === f.properties.uf;
  return {
    color: estado.camada ? "#3d4b57" : "#ffffff", weight: aberta ? 2.5 : (estado.camada ? 1 : 1.4),
    fillColor: corRegiao[f.properties.regiao] || "#0b6fa4",
    fillOpacity: (aberta || estado.camada) ? 0 : (naSatelite() ? .12 : .28)
  };
}
function restilizar() {
  camadaUF?.setStyle(estiloUF);
  estado.camadaMun?.setStyle(estiloMun);
}

/* ---------- Camada dos municípios ---------- */
function estiloMun(f) {
  const sel = estado.selecionado && estado.selecionado[0] === f.properties.id;
  return {
    color: sel ? "#d94141" : (naSatelite() ? "rgba(255,255,255,.8)" : "#0b6fa4"),
    weight: sel ? 3 : .7,
    fillColor: sel ? "#d94141" : "#0b6fa4",
    fillOpacity: sel ? .18 : (naSatelite() ? .04 : .06)
  };
}

async function carregarJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} em ${url}`);
  return r.json();
}

async function abrirUF(sigla, { voar = true } = {}) {
  if (estado.ufAberta === sigla && estado.camadaMun) { if (voar) voarPara(estado.camadaMun.getBounds()); return; }
  estado.ufAberta = sigla;
  if (estado.camadaMun) { mapa.removeLayer(estado.camadaMun); estado.camadaMun = null; }
  restilizar();
  atualizarTrilha();
  toast(`Carregando municípios de ${estado.estados[sigla]?.nome || sigla}…`);
  try {
    if (!estado.cacheMun[sigla]) estado.cacheMun[sigla] = await carregarJSON(`dados/mapas/municipios-${sigla}.json`);
  } catch (e) { avisar("Não consegui carregar os municípios deste estado. Tente de novo em instantes."); return; }
  if (estado.ufAberta !== sigla) return; // a pessoa já mudou de estado
  estado.camadaMun = L.geoJSON(estado.cacheMun[sigla], {
    style: estiloMun,
    onEachFeature: (f, camada) => {
      camada.bindTooltip(esc(f.properties.nome), { sticky: true, className: "nome-mun", direction: "top" });
      camada.on({
        mouseover: e => { if (!(estado.selecionado && estado.selecionado[0] === f.properties.id)) e.target.setStyle({ fillOpacity: .25, weight: 1.5 }); },
        mouseout: e => estado.camadaMun?.resetStyle(e.target),
        click: () => selecionar(estado.porId.get(f.properties.id), { voar: false })
      });
    }
  }).addTo(mapa);
  if (voar) voarPara(estado.camadaMun.getBounds());
}

function voltarBrasil() {
  if (estado.camadaMun) { mapa.removeLayer(estado.camadaMun); estado.camadaMun = null; }
  estado.ufAberta = null; estado.selecionado = null;
  fecharPainel(); restilizar(); atualizarTrilha(); marcador && mapa.removeLayer(marcador);
  history.replaceState(null, "", location.pathname);
  mapa.flyToBounds(camadaUF.getBounds(), { duration: .8, padding: [20, 20] });
}

function voarPara(limites) {
  const largo = window.innerWidth > 820;
  mapa.flyToBounds(limites, {
    duration: .9, maxZoom: 10,
    paddingTopLeft: [20, largo ? 90 : 150],
    paddingBottomRight: [largo && estado.selecionado ? 470 : 20, largo ? 20 : (estado.selecionado ? window.innerHeight * .5 : 90)]
  });
}

/* ---------- Trilha ---------- */
function atualizarTrilha() {
  const t = $("trilha"); const partes = [];
  partes.push(`<button data-ir="br" ${!estado.ufAberta ? "disabled" : ""}>🇧🇷 Brasil</button>`);
  if (estado.ufAberta) partes.push(`<i>›</i><button data-ir="uf" ${!estado.selecionado ? "disabled" : ""}>${esc(estado.estados[estado.ufAberta]?.nome || estado.ufAberta)}</button>`);
  if (estado.selecionado) partes.push(`<i>›</i><button disabled>${esc(estado.selecionado[1])}</button>`);
  t.innerHTML = estado.ufAberta ? partes.join("") : "";
}
$("trilha").addEventListener("click", e => {
  const b = e.target.closest("button[data-ir]"); if (!b || b.disabled) return;
  if (b.dataset.ir === "br") voltarBrasil();
  else { estado.selecionado = null; fecharPainel(); restilizar(); atualizarTrilha(); voarPara(estado.camadaMun.getBounds()); }
});

/* ---------- Selecionar município ---------- */
let marcador = null;
async function selecionar(linha, { voar = true, ponto = null } = {}) {
  if (!linha) return;
  const [id, nome, uf, lat, lon] = linha;
  estado.selecionado = linha;
  history.replaceState(null, "", `#m=${id}`);
  if (estado.cartaoAberto) { estado.cartaoAberto = false; desenharCartaoCamadas(); }
  abrirPainel(linha);
  await abrirUF(uf, { voar: false });
  restilizar(); atualizarTrilha();
  if (marcador) mapa.removeLayer(marcador);
  if (ponto) marcador = L.circleMarker(ponto, { radius: 9, color: "#fff", weight: 3, fillColor: "#d94141", fillOpacity: 1 }).addTo(mapa);
  if (voar) {
    let alvo = null;
    estado.camadaMun?.eachLayer(c => { if (c.feature.properties.id === id) alvo = c; });
    voarPara(alvo ? alvo.getBounds() : L.latLng(lat, lon).toBounds(30000));
  }
  buscarClimaAgora(linha, ponto);
}

/* ---------- Painel ---------- */
function abrirPainel(linha) {
  const [, nome, uf] = linha; const e = estado.estados[uf] || {};
  $("pNome").textContent = nome;
  $("pSub").textContent = `${e.nome || uf} · Região ${e.regiao || ""}`;
  $("pCorpo").innerHTML = `<div class="carregando"><div class="giro"></div>Buscando o clima de agora…</div>`;
  $("painel").classList.remove("fechado");
  document.body.classList.add("com-painel");
}
function fecharPainel() {
  $("painel").classList.add("fechado");
  document.body.classList.remove("com-painel");
  window.speechSynthesis?.cancel();
}
$("pFechar").addEventListener("click", () => {
  estado.selecionado = null; fecharPainel(); restilizar(); atualizarTrilha();
  history.replaceState(null, "", location.pathname);
});

/* Códigos de tempo da OMM -> texto e ícone */
const TEMPO = {
  0:["Céu limpo","☀️","🌙"], 1:["Quase limpo","🌤️","🌙"], 2:["Parcialmente nublado","⛅","☁️"], 3:["Nublado","☁️","☁️"],
  45:["Neblina","🌫️"], 48:["Neblina com geada","🌫️"],
  51:["Garoa fraca","🌦️"], 53:["Garoa","🌦️"], 55:["Garoa forte","🌧️"], 56:["Garoa congelante","🌧️"], 57:["Garoa congelante forte","🌧️"],
  61:["Chuva fraca","🌦️"], 63:["Chuva","🌧️"], 65:["Chuva forte","🌧️"], 66:["Chuva congelante","🌧️"], 67:["Chuva congelante forte","🌧️"],
  71:["Neve fraca","🌨️"], 73:["Neve","🌨️"], 75:["Neve forte","❄️"], 77:["Granizo fino","🌨️"],
  80:["Pancadas de chuva fracas","🌦️"], 81:["Pancadas de chuva","🌧️"], 82:["Pancadas de chuva fortes","⛈️"],
  85:["Pancadas de neve","🌨️"], 86:["Pancadas de neve fortes","❄️"],
  95:["Trovoada","⛈️"], 96:["Trovoada com granizo","⛈️"], 99:["Trovoada forte com granizo","⛈️"]
};
const tempo = (c, dia) => { const t = TEMPO[c] || ["—","🌡️"]; return { texto: t[0], icone: (!dia && t[2]) ? t[2] : t[1] }; };
const DIRS = ["norte","nordeste","leste","sudeste","sul","sudoeste","oeste","noroeste"];
const SIG = ["N","NE","L","SE","S","SO","O","NO"];
const direcao = g => Math.round(((g % 360) / 45)) % 8;
const fmt = (n, c = 0) => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: c, minimumFractionDigits: c });

/* =========================================================
   ETAPA 2 — Previsão: Agora · 16 dias · Hora a hora
   Uma única chamada à Open-Meteo, feita pelo navegador.
   ========================================================= */
const SEMANA = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const SEMANA_LONGA = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const dataLocal = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const rotDia = (s, i) => i === 0 ? "Hoje" : i === 1 ? "Amanhã" : `${SEMANA[dataLocal(s).getDay()]} ${s.slice(8, 10)}/${s.slice(5, 7)}`;
const DIA_CHUVA = 1; // mm — a partir disso conta como "dia com chuva"
const COR_MAX = "#e0662d", COR_MIN = "#2a78c8", COR_CHUVA = "#2a78c8";

async function buscarClimaAgora(linha, ponto) {
  const [, , , latM, lonM] = linha;
  const lat = ponto ? ponto[0] : latM, lon = ponto ? ponto[1] : lonM;
  const url = "https://api.open-meteo.com/v1/forecast?" + new URLSearchParams({
    latitude: lat, longitude: lon, timezone: "auto", forecast_days: 16,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day,cloud_cover",
    hourly: "temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max,sunrise,sunset,sunshine_duration,et0_fao_evapotranspiration"
  });
  try {
    const d = await carregarJSON(url);
    if (estado.selecionado !== linha) return;
    estado.climaAtual = d; estado.local = { lat, lon };
    estado.diaHora = 0;
    montarFala(linha, d);
    desenharAba();
  } catch (e) {
    if (estado.selecionado !== linha) return;
    $("pCorpo").innerHTML = `<div class="erro">Não consegui buscar o clima agora. Verifique a internet e toque no município de novo.</div>`;
  }
}

function trocarAba(aba) {
  estado.aba = aba;
  document.querySelectorAll("#abas button").forEach(x => x.classList.toggle("ativa", x.dataset.aba === aba));
  $("pCorpo").scrollTop = 0;

function desenharAba() {
  const d = estado.climaAtual, linha = estado.selecionado;

  else if (estado.aba === "hora") desenharHoras(d);

  else if (estado.aba === "campo") desenharCampo(d);

function resumoSemana(d) {
  const dd = d.daily, n = 7;
  let dias = 0, total = 0, iQuente = 0;
  for (let i = 0; i < n; i++) {
    const mm = dd.precipitation_sum[i] || 0; total += mm; if (mm >= DIA_CHUVA) dias++;
    if (dd.temperature_2m_max[i] > dd.temperature_2m_max[iQuente]) iQuente = i;
  }
  const chuva = dias === 0 ? "<b>Sem chuva prevista</b> nos próximos 7 dias."
    : `Chuva em <b>${dias} ${dias === 1 ? "dia" : "dias"}</b> dos próximos 7, somando cerca de <b>${fmt(total)} mm</b>.`;
  return `<p class="resumo">${chuva} Dia mais quente: <b>${rotDia(dd.time[iQuente], iQuente).toLowerCase()}</b>, com ${fmt(dd.temperature_2m_max[iQuente])}°.</p>`;
}

/* ---------- Aba: 16 dias ---------- */
function desenharDias(d) {
  const dd = d.daily;
  const tmin = Math.min(...dd.temperature_2m_min), tmax = Math.max(...dd.temperature_2m_max);
  const linhas = dd.time.map((s, i) => {
    const t = tempo(dd.weather_code[i], 1);
    const a = ((dd.temperature_2m_min[i] - tmin) / (tmax - tmin || 1)) * 100;
    const b = ((dd.temperature_2m_max[i] - tmin) / (tmax - tmin || 1)) * 100;
    const prob = dd.precipitation_probability_max[i] ?? 0, mm = dd.precipitation_sum[i] || 0;
    return `${i === 7 ? `<div class="sep-tend">📉 Daqui para frente é <b>tendência</b>: a previsão fica menos certeira</div>` : ""}
      <button class="dia ${i >= 7 ? "tend" : ""}" data-dia="${i}" title="Ver hora a hora">
        <span class="d-nome">${rotDia(s, i)}</span>
        <span class="d-ic">${t.icone}</span>
        <span class="d-chuva ${mm >= DIA_CHUVA ? "tem" : ""}">${prob}%<small>${mm >= .1 ? fmt(mm, mm < 10 ? 1 : 0) + " mm" : "—"}</small></span>
        <span class="d-temp"><small>${fmt(dd.temperature_2m_min[i])}°</small><i class="faixa"><i style="left:${a}%;right:${100 - b}%"></i></i><b>${fmt(dd.temperature_2m_max[i])}°</b></span>
      </button>`;
  }).join("");
  const totalMm = dd.precipitation_sum.reduce((s, v) => s + (v || 0), 0);
  $("pCorpo").innerHTML = `
    <div class="secao primeira">
      <h3>Temperatura máxima e mínima</h3>
      <div class="graf" id="gTemp"></div>
    </div>
    <div class="secao">
      <h3>Chuva por dia <span class="h3-extra">total ≈ ${fmt(totalMm)} mm em 16 dias</span></h3>
      <div class="graf" id="gChuva"></div>
    </div>
    <div class="secao">
      <h3>Dia a dia <span class="h3-extra">toque num dia para ver hora a hora</span></h3>
      <div class="lista-dias">${linhas}</div>
    </div>
    <p class="nota">Previsão por modelos meteorológicos (Open-Meteo). Os primeiros 7 dias são os mais confiáveis.</p>`;
  const rot = dd.time.map((s, i) => rotDia(s, i));
  grafLinha($("gTemp"), {
    rotulos: rot, unidade: "°C", casas: 0,
    series: [{ nome: "Máxima", cor: COR_MAX, valores: dd.temperature_2m_max }, { nome: "Mínima", cor: COR_MIN, valores: dd.temperature_2m_min }],
    sombraDepois: 7
  });
  grafBarras($("gChuva"), {
    rotulos: rot, unidade: "mm", casas: 1, cor: COR_CHUVA, valores: dd.precipitation_sum.map(v => v || 0),
    extra: i => `Chance de chuva: ${dd.precipitation_probability_max[i] ?? 0}%`, sombraDepois: 7
  });
}

function desenharHoras(d) {
  const dd = d.daily, h = d.hourly, dia = estado.diaHora || 0;
  const ini = dia * 24, fim = ini + 24;

    const passou = dia === 0 && s.slice(0, 13) < agoraH, eAgora = s.slice(0, 13) === agoraH;
    return `<div class="hora ${passou ? "passou" : ""} ${eAgora ? "agora-h" : ""}">

  }).join("");
  $("pCorpo").innerHTML = `
    <div class="chips-dias">${chips}</div>

    <div class="secao primeira"><h3>Temperatura</h3><div class="graf" id="gHT"></div></div>
    <div class="secao"><h3>Chance de chuva</h3><div class="graf" id="gHC"></div></div>
    <div class="secao"><h3>Hora por hora <span class="h3-extra">arraste para o lado</span></h3><div class="faixa-horas" id="fHoras">${cartoes}</div></div>
    ${dia >= 7 ? `<p class="nota">Este dia já está na faixa de <b>tendência</b>: use como ideia geral, não como certeza.</p>` : ""}`;

  grafBarras($("gHC"), { rotulos: rot, unidade: "%", casas: 0, cor: COR_CHUVA, valores: h.precipitation_probability.slice(ini, fim).map(v => v ?? 0), max: 100,
    extra: k => `Chuva: ${fmt(h.precipitation[ini + k] || 0, 1)} mm` });
  const atual = $("fHoras").querySelector(".agora-h");

function resumoDia(d, i) {
  const dd = d.daily, t = tempo(dd.weather_code[i], 1);
  const nome = i === 0 ? "Hoje" : i === 1 ? "Amanhã" : `${SEMANA_LONGA[dataLocal(dd.time[i]).getDay()]}, ${dd.time[i].slice(8, 10)}/${dd.time[i].slice(5, 7)}`;
  const mm = dd.precipitation_sum[i] || 0;
  const sol = dd.sunshine_duration?.[i] != null ? ` · ☀️ ${fmt(dd.sunshine_duration[i] / 3600)} h de sol` : "";
  return `<b>${nome}:</b> ${t.icone} ${t.texto.toLowerCase()} · ${fmt(dd.temperature_2m_min[i])}° a ${fmt(dd.temperature_2m_max[i])}° · ` +
    `${mm >= .1 ? `🌧️ ${fmt(mm, 1)} mm` : "sem chuva"} · 💨 até ${fmt(dd.wind_gusts_10m_max[i])} km/h${sol}`;
}

/* =========================================================
   ETAPA 3 — Histórico desde 1940 e comparação com a média
   Fonte: Open-Meteo Historical (reanálise ERA5), buscada
   pelo navegador só quando a pessoa abre a aba.
   Normal climatológica: 1991–2020 (padrão da OMM).
   ========================================================= */
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MESES_LONGO = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const NORMAL_INI = 1991, NORMAL_FIM = 2020;
const COR_MEDIA = "#9aa8b4";
const cacheHist = new Map();

function isoHoje(menosDias = 0) {
  const d = new Date(); d.setDate(d.getDate() - menosDias);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function buscarHistorico() {
  const linha = estado.selecionado; if (!linha) return;
  const { lat, lon } = estado.local;
  const chave = `${lat.toFixed(3)},${lon.toFixed(3)}`;
  if (cacheHist.has(chave)) return cacheHist.get(chave);
  const vars = ["temperature_2m_max","temperature_2m_min","temperature_2m_mean","precipitation_sum","wind_gusts_10m_max","sunshine_duration","et0_fao_evapotranspiration","relative_humidity_2m_mean"];
  const pedir = v => carregarJSON("https://archive-api.open-meteo.com/v1/archive?" + new URLSearchParams({
    latitude: lat, longitude: lon, timezone: "auto", start_date: "1940-01-01", end_date: isoHoje(2), daily: v.join(",")
  }));
  let d;
  try { d = await pedir(vars); }
  catch (e) { d = await pedir(vars.filter(v => v !== "relative_humidity_2m_mean")); } // se a umidade não vier, segue sem ela
  const H = processarHistorico(d.daily);
  cacheHist.set(chave, H);
  return H;
}

/* ---------- Contas ---------- */
function processarHistorico(dd) {
  const n = dd.time.length;
  const t = dd.time, chuva = dd.precipitation_sum, tmed = dd.temperature_2m_mean, tmax = dd.temperature_2m_max, tmin = dd.temperature_2m_min;
  // corta o fim que ainda vem vazio (os últimos dias demoram a chegar)
  let ult = n - 1; while (ult > 0 && (chuva[ult] == null || tmed[ult] == null)) ult--;
  const anos = {}; // ano -> {m: [12 meses], chuva, tSoma, tN, diasChuva}
  const novoMes = () => ({ chuva: 0, tSoma: 0, tN: 0, maxSoma: 0, minSoma: 0, diasChuva: 0, dias: 0 });
  const porDiaAno = {}; // "MM-DD" -> {chuva, t, n} só nos anos da normal
  for (let i = 0; i <= ult; i++) {
    if (chuva[i] == null || tmed[i] == null) continue;
    const a = +t[i].slice(0, 4), m = +t[i].slice(5, 7) - 1;
    const A = anos[a] ??= { m: Array.from({ length: 12 }, novoMes), dias: 0 };
    const M = A.m[m];
    M.chuva += chuva[i]; M.tSoma += tmed[i]; M.tN++; M.maxSoma += tmax[i]; M.minSoma += tmin[i]; M.dias++;
    if (chuva[i] >= DIA_CHUVA) M.diasChuva++;
    A.dias++;
    if (a >= NORMAL_INI && a <= NORMAL_FIM) {
      const k = t[i].slice(5, 10), P = porDiaAno[k] ??= { chuva: 0, t: 0, n: 0 };
      P.chuva += chuva[i]; P.t += tmed[i]; P.n++;
    }
  }
  // normal mensal 1991–2020
  const normal = MESES.map((_, m) => {
    let c = 0, tt = 0, mx = 0, mn = 0, dc = 0, k = 0;
    for (let a = NORMAL_INI; a <= NORMAL_FIM; a++) {
      const M = anos[a]?.m[m]; if (!M || !M.tN) continue;
      c += M.chuva; tt += M.tSoma / M.tN; mx += M.maxSoma / M.tN; mn += M.minSoma / M.tN; dc += M.diasChuva; k++;
    }
    return { chuva: c / k, t: tt / k, max: mx / k, min: mn / k, diasChuva: dc / k };
  });
  const normalAnoChuva = normal.reduce((s, x) => s + x.chuva, 0);
  const normalAnoT = normal.reduce((s, x) => s + x.t, 0) / 12;
  // anos completos
  const anoAtual = +t[ult].slice(0, 4);
  const listaAnos = Object.keys(anos).map(Number).sort((x, y) => x - y);
  const completos = listaAnos.filter(a => a < anoAtual && anos[a].dias >= 360);
  const anual = completos.map(a => {
    const ms = anos[a].m;
    return { ano: a, chuva: ms.reduce((s, M) => s + M.chuva, 0), t: ms.reduce((s, M) => s + M.tSoma, 0) / ms.reduce((s, M) => s + M.tN, 0) };
  });
  // tendência da temperatura (regressão linear simples)
  const mx = anual.reduce((s, x) => s + x.ano, 0) / anual.length, my = anual.reduce((s, x) => s + x.t, 0) / anual.length;
  const incl = anual.reduce((s, x) => s + (x.ano - mx) * (x.t - my), 0) / anual.reduce((s, x) => s + (x.ano - mx) ** 2, 0);
  // últimos 30 e 90 dias contra a normal dos mesmos dias do calendário
  const janela = dias => {
    let c = 0, cn = 0, tt = 0, tn = 0, k = 0;
    for (let i = ult; i >= 0 && k < dias; i--) {
      if (chuva[i] == null) continue;
      const P = porDiaAno[t[i].slice(5, 10)];
      c += chuva[i]; tt += tmed[i]; k++;
      if (P) { cn += P.chuva / P.n; tn += P.t / P.n; }
    }
    return { chuva: c, chuvaNormal: cn, t: tt / k, tNormal: tn / k, dias: k };
  };
  // recordes e sequência seca
  const rec = { quente: [-99, ""], frio: [99, ""], chuva: [0, ""], rajada: [0, ""], seca: [0, "", ""] };
  let seq = 0, iniSeq = "";
  for (let i = 0; i <= ult; i++) {
    if (tmax[i] != null && tmax[i] > rec.quente[0]) rec.quente = [tmax[i], t[i]];
    if (tmin[i] != null && tmin[i] < rec.frio[0]) rec.frio = [tmin[i], t[i]];
    if (chuva[i] != null && chuva[i] > rec.chuva[0]) rec.chuva = [chuva[i], t[i]];
    const g = dd.wind_gusts_10m_max?.[i]; if (g != null && g > rec.rajada[0]) rec.rajada = [g, t[i]];
    if (chuva[i] != null && chuva[i] < DIA_CHUVA) { if (!seq) iniSeq = t[i]; seq++; if (seq > rec.seca[0]) rec.seca = [seq, iniSeq, t[i]]; }
    else seq = 0;
  }
  const anoMaisChuvoso = anual.reduce((a, b) => b.chuva > a.chuva ? b : a), anoMaisSeco = anual.reduce((a, b) => b.chuva < a.chuva ? b : a);
  const anoMaisQuente = anual.reduce((a, b) => b.t > a.t ? b : a);
  return {
    anos, normal, normalAnoChuva, normalAnoT, anual, anoAtual, ultimoDia: t[ult], primeiroAno: listaAnos[0],
    tendencia: incl * 10, j30: janela(30), j90: janela(90), rec, seqAtual: seq, iniSeqAtual: iniSeq,
    anoMaisChuvoso, anoMaisSeco, anoMaisQuente, temUmidade: !!dd.relative_humidity_2m_mean
  };
}

/* ---------- Aba: Histórico ---------- */
async function desenharHistorico() {
  const linha = estado.selecionado;
  $("pCorpo").innerHTML = `<div class="carregando"><div class="giro"></div><div>Buscando mais de 80 anos de clima…<br><small>Na primeira vez pode levar alguns segundos.</small></div></div>`;
  let H;
  try { H = await buscarHistorico(); }
  catch (e) {
    if (estado.selecionado === linha && estado.aba === "hist")
      $("pCorpo").innerHTML = `<div class="erro">Não consegui buscar o histórico agora (o servidor pode estar ocupado). Tente de novo em alguns minutos.</div>`;
    return;
  }
  if (estado.selecionado !== linha || estado.aba !== "hist") return;
  estado.hist = H;
  if (!estado.anoComp || !H.anos[estado.anoComp]) estado.anoComp = H.anoAtual;

  const pct = (v, n) => n > 0 ? Math.round((v / n) * 100) : 0;
  const situacao = p => p < 60 ? ["bem abaixo da média", "seco"] : p < 85 ? ["abaixo da média", "seco"] : p <= 115 ? ["dentro da média", "ok"] : p <= 150 ? ["acima da média", "umido"] : ["bem acima da média", "umido"];
  const p30 = pct(H.j30.chuva, H.j30.chuvaNormal), p90 = pct(H.j90.chuva, H.j90.chuvaNormal);
  const s30 = situacao(p30), s90 = situacao(p90);
  const dT30 = H.j30.t - H.j30.tNormal;
  const fData = s => `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}`;
  const anosSel = Object.keys(H.anos).map(Number).sort((a, b) => b - a).map(a => `<option value="${a}" ${a === estado.anoComp ? "selected" : ""}>${a}${a === H.anoAtual ? " (até agora)" : ""}</option>`).join("");

  $("pCorpo").innerHTML = `
    <p class="resumo">Dados de <b>${H.primeiroAno}</b> até <b>${fData(H.ultimoDia)}</b>. "Média" = normal climatológica <b>${NORMAL_INI}–${NORMAL_FIM}</b> deste ponto.</p>

    <div class="secao primeira">
      <h3>Como está a chuva</h3>
      <div class="grade">
        <div class="item kpi ${s30[1]}"><div class="r">🌧️ Últimos 30 dias</div><div class="v">${fmt(H.j30.chuva)}<small> mm</small></div>
          <div class="k-sub">${p30}% da média (${fmt(H.j30.chuvaNormal)} mm) · <b>${s30[0]}</b></div></div>
        <div class="item kpi ${s90[1]}"><div class="r">🌧️ Últimos 90 dias</div><div class="v">${fmt(H.j90.chuva)}<small> mm</small></div>
          <div class="k-sub">${p90}% da média (${fmt(H.j90.chuvaNormal)} mm) · <b>${s90[0]}</b></div></div>
        <div class="item kpi"><div class="r">🌡️ Temperatura, 30 dias</div><div class="v">${fmt(H.j30.t, 1)}<small> °C</small></div>

  desenharAnoEscolhido(H);
